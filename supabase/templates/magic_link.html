<!-- Anmeldecode für ein bestehendes Konto (signInWithOtp). Die App fragt den Code ab, Links gibt es nicht. -->
<h2>Dein Anmeldecode für Kostenkurve</h2>
<p>Gib diesen Code in der App ein:</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>Der Code gilt zehn Minuten. Wenn du dich nicht anmelden wolltest, ignoriere diese E-Mail.</p>
<hr>
<p>Your Kostenkurve sign-in code: <strong>{{ .Token }}</strong> – valid for ten minutes. If you did not try to sign in, ignore this email.</p>
